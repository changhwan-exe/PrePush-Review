# 찬반 리뷰 파이프라인 설정 — 이 저장소에 맞게 고친다.
# prepush.sh 와 pre-push 훅이 읽는다. 같은 이름의 환경변수를 주면 그 값이 이긴다.
# 형식: : "${이름:=값}"   (환경변수가 비어 있을 때만 값을 넣는다)

: "${REVIEW_BASE:=origin/main}"     # 비교 기준 브랜치 — 작업 브랜치가 PR 로 들어가는 곳
: "${REVIEW_PATHS:=src}"            # 리뷰할 소스 경로 (쉼표 구분, 저장소 루트 기준). 예: src,packages/core/lib
: "${REVIEW_EXCLUDE:=}"             # 리뷰 · 수정 커밋에서 뺄 파일 glob (쉼표 구분). 예: **/*.meta,**/*.generated.cs

# 아래는 필요할 때만 주석을 풀어 바꾼다 (값은 기본값)
# : "${REVIEW_LEVEL:=high}"             # 찾기 단계에서 기본 스킬 code-review 에 주는 강도
# : "${REVIEW_MAX_ROUNDS:=3}"           # 리뷰 라운드 수 (마지막 라운드는 확인만)
# : "${REVIEW_DEBATE_ROUNDS:=2}"        # 재반박을 주고받는 상한
# : "${REVIEW_COMPILE_CMD:=}"           # 수정 직후 실행할 확인 명령 (실패하면 수정을 stash 에 보관하고 멈춤). 예: npm run build
# : "${REVIEW_CON_MODEL:=}"             # 찾기 · 반대파 모델 (비우면 기본 모델)
# : "${REVIEW_PRO_MODEL:=}"             # 찬성파 모델
# : "${REVIEW_FIX_MODEL:=}"             # 수정 담당 모델
